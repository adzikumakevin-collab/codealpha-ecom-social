{% extends 'shop/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 mt-5">
            <h2 class="text-center mb-4">Nouvelle Publication</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Quoi de neuf ?</label>
                    <textarea name="content" class="form-control" rows="4" placeholder="Partagez quelque chose avec la communauté..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ajouter une image (facultatif)</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Publier</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
